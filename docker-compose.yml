version: '3.8'
services:
  pdf_split_rotate:
    build: .
    container_name: pdf_split_rotate
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./input:/app/input
      - ./output:/app/output
      - ./logs:/app/logs
    # Optionally, expose ports if needed (not required for this service)
    # ports:
    #   - "8080:8080"
